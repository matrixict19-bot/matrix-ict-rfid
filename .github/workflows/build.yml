name: Build MATRIX APK FULL UHF
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev libltdl-dev autoconf automake libtool pkg-config zlib1g-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Fix buildozer.spec (one time only)
        run: |
          # This spec was causing all the DuplicateOption errors - we fix it cleanly
          cat > buildozer.spec << 'EOF'
          [app]
          title = MATRIX ICT RFID
          package.name = matrixictrfid
          package.domain = com.matrixict.rfid
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,jar
          source.include_patterns = libs/*,reader.jar,03_Libs_UHF_C72/*
          version = 1.0
          requirements = python3,kivy==2.3.1,pyjnius,requests
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET,ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION,BLUETOOTH,BLUETOOTH_ADMIN,BLUETOOTH_CONNECT,BLUETOOTH_SCAN
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.sdk = 33
          android.accept_sdk_license_agreement = True
          android.add_jars = reader.jar
          p4a.branch = 2024.01.21
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          echo "=== NEW buildozer.spec ==="
          cat buildozer.spec
          # Copy UHF libs if exist
          if [ -f "03_Libs_UHF_C72/reader.jar" ]; then cp 03_Libs_UHF_C72/reader.jar ./reader.jar; ls -lh reader.jar; fi
          if [ -d "03_Libs_UHF_C72/libs" ]; then cp -r 03_Libs_UHF_C72/libs ./; fi

      - name: Build APK
        run: |
          set -o pipefail
          buildozer android debug --verbose 2>&1 | tee build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            .buildozer/logs/*
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-ict-apk-full-uhf
          path: bin/*.apk
