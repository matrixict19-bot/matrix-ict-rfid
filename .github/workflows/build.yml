name: Build MATRIX APK FULL UHF
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev libltdl-dev autoconf automake libtool pkg-config zlib1g-dev
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==3.0.0

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = MATRIX ICT RFID
          package.name = matrixictrfid
          package.domain = com.matrixict.rfid
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,jar
          source.include_patterns = libs/*,reader.jar,03_Libs_UHF_C72/*
          version = 1.0
          requirements = python3,kivy==2.3.1,pyjnius,requests==2.27.1
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET,ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION,BLUETOOTH,BLUETOOTH_ADMIN,BLUETOOTH_CONNECT,BLUETOOTH_SCAN
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          android.add_jars = reader.jar
          p4a.branch = master
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          cp 03_Libs_UHF_C72/reader.jar ./reader.jar || true

      - name: Pre-clone p4a
        run: |
          rm -rf .buildozer/android/platform/python-for-android
          rm -rf $HOME/.buildozer/android/platform/android-ndk-*
          mkdir -p .buildozer/android/platform
          git clone https://github.com/kivy/python-for-android.git .buildozer/android/platform/python-for-android --branch master --depth 1
          echo "Cloned p4a"
          # FIX: pip upgrade bug - find file and patch, ignore if not found (5 POINTS - prevent repeat)
          find .buildozer/android/platform/python-for-android -name "*.py" -type f -exec grep -l "pip install -U pip" {} \; 2>/dev/null | head -5
          find .buildozer/android/platform/python-for-android -name "*.py" -type f -exec sed -i 's/pip install -U pip/echo skip pip upgrade/g' {} \; 2>/dev/null || true
          echo "pip patch done (or skipped if not needed)"

      - name: Fix SDK paths
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          echo "SDK_DIR $SDK_DIR"
          if [ ! -d "$SDK_DIR" ]; then
            buildozer android debug --verbose 2>&1 | head -100 || true
          fi
          NEW_MGR=$(find $SDK_DIR -name sdkmanager -type f 2>/dev/null | head -1)
          OLD_MGR=$SDK_DIR/tools/bin/sdkmanager
          echo "NEW $NEW_MGR OLD $OLD_MGR"
          if [ -f "$NEW_MGR" ]; then
            mkdir -p $(dirname $OLD_MGR)
            ln -sf $NEW_MGR $OLD_MGR || true
            chmod +x $NEW_MGR || true
            yes | $NEW_MGR --sdk_root=$SDK_DIR --licenses || true
            $NEW_MGR --sdk_root=$SDK_DIR "platform-tools" "build-tools;33.0.2" "build-tools;37.0.0" "platforms;android-33" || true
          fi
          mkdir -p $SDK_DIR/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_DIR/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK_DIR/licenses/android-sdk-license
          echo "24333f8a63b6825ea1c5514fbf989ee4384f793" >> $SDK_DIR/licenses/android-sdk-license
          ls -lh $OLD_MGR $NEW_MGR || true

      - name: Build APK
        run: |
          set -o pipefail
          buildozer android debug --verbose 2>&1 | tee build.log
          ls -lh bin/
          find . -name "*.apk" | head -5

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            .buildozer/logs/*
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-ict-apk-full-uhf
          path: bin/*.apk
          if-no-files-found: warn
