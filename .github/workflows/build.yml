name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython virtualenv setuptools

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Download SDK (first pass, may fail on licenses)
        run: buildozer -v android debug || true

      - name: Accept Android SDK licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKM=$(find "$SDK" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses || true

      - name: Build debug APK
        run: buildozer -v android debug

      # Sign with the fixed Matrix ICT key (GitHub secret KEYSTORE_B64) so every new APK
      # installs over the old one and keeps the app data. Without the secret the debug
      # signature is kept (then the old app must be uninstalled first).
      - name: Sign APK with stable key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No KEYSTORE_B64 secret - keeping debug signature"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > matrix.keystore
          BT=$(ls -d "$HOME"/.buildozer/android/platform/android-sdk/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          APK=$(ls bin/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks matrix.keystore --ks-key-alias matrix \
            --ks-pass pass:9a10a083198c3c3964c2e856 --key-pass pass:9a10a083198c3c3964c2e856 \
            --out bin/MatrixICT-RFID-signed.apk aligned.apk
          "$BT/apksigner" verify --print-certs bin/MatrixICT-RFID-signed.apk
          rm -f "$APK" aligned.apk matrix.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: matrix-rfid-apk
          path: bin/*.apk
