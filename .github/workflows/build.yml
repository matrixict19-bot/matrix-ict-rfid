name: Build MATRIX APK FULL UHF
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev libltdl-dev autoconf automake libtool pkg-config zlib1g-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Create clean buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = MATRIX ICT RFID
          package.name = matrixictrfid
          package.domain = com.matrixict.rfid
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,jar
          source.include_patterns = libs/*,reader.jar,03_Libs_UHF_C72/*
          version = 1.0
          requirements = python3==3.11.6,kivy==2.3.1,pyjnius,requests
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET,ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION,BLUETOOTH,BLUETOOTH_ADMIN,BLUETOOTH_CONNECT,BLUETOOTH_SCAN
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          android.add_jars = reader.jar
          p4a.branch = master
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          cat buildozer.spec
          if [ -f "03_Libs_UHF_C72/reader.jar" ]; then cp 03_Libs_UHF_C72/reader.jar ./reader.jar; fi
          if [ -d "03_Libs_UHF_C72/libs" ]; then cp -r 03_Libs_UHF_C72/libs ./; fi
          ls -lh reader.jar || echo "reader.jar not found - continuing without it"

      - name: Pre-clone and patch p4a (fix pip 26 bug)
        run: |
          mkdir -p .buildozer/android/platform
          rm -rf .buildozer/android/platform/python-for-android
          git clone https://github.com/kivy/python-for-android.git .buildozer/android/platform/python-for-android --depth 1
          cd .buildozer/android/platform/python-for-android
          echo "Cloned p4a master: $(git log -1 --oneline)"
          sed -i 's/pip install -U pip/echo "skip pip upgrade - patched for pip26"/g' pythonforandroid/build.py
          echo "Patched build.py"

      - name: Build APK
        run: |
          set -o pipefail
          buildozer android debug --verbose 2>&1 | tee build.log
          echo "Build finished with ${PIPESTATUS[0]}"
          ls -lh bin/ || echo "No bin yet"
          find bin -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            .buildozer/logs/*
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-ict-apk-full-uhf
          path: bin/*.apk
          if-no-files-found: warn
