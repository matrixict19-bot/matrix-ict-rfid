name: Build MATRIX APK FULL UHF
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          rm -rf .buildozer
          df -h
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libtool libffi-dev autoconf automake pkg-config libltdl-dev zip unzip zlib1g-dev libssl-dev
      - name: Install Android SDK
        run: |
          SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_ROOT/cmdline-tools $SDK_ROOT/licenses
          cd /tmp && rm -rf cmdline-tools tools.zip
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          rm -rf $SDK_ROOT/cmdline-tools/latest
          mv cmdline-tools $SDK_ROOT/cmdline-tools/latest
          mkdir -p $SDK_ROOT/tools/bin
          ln -sf $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $SDK_ROOT/tools/bin/sdkmanager
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $SDK_ROOT/licenses/android-sdk-preview-license || true
          yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393" || true
      - name: Install Buildozer STABLE
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36 buildozer==1.5.0
      - name: Prepare UHF libs & Fix spec
        run: |
          echo "=== Files before ==="
          ls -la
          if [ -f "03_Libs_UHF_C72/reader.jar" ]; then cp 03_Libs_UHF_C72/reader.jar ./reader.jar; echo "Copied reader.jar"; fi
          if [ -d "03_Libs_UHF_C72/libs" ]; then cp -r 03_Libs_UHF_C72/libs ./; echo "Copied libs"; fi
          ls -lh reader.jar || echo "WARNING: reader.jar missing - APK will be without UHF"
          for SPEC in buildozer.spec buildozer_full_UHF.spec; do
            if [ -f "$SPEC" ]; then
              echo "Patching $SPEC"
              sed -i 's/^requirements =.*/requirements = python3,kivy==2.3.1,pyjnius==1.8.0,requests==2.31.0,charset_normalizer==3.3.2/' "$SPEC" || true
              sed -i '/^p4a.branch/d' "$SPEC" || true
              sed -i '/^android.ndk/d' "$SPEC" || true
              sed -i '/^android.api/d' "$SPEC" || true
              sed -i '/^android.minapi/d' "$SPEC" || true
              sed -i '/^android.sdk/d' "$SPEC" || true
              sed -i '/^android.accept_sdk_license_agreement/d' "$SPEC" || true
              sed -i '/^android.add_jars/d' "$SPEC" || true
              echo "p4a.branch = v2024.10.13" >> "$SPEC"
              echo "android.ndk = 25b" >> "$SPEC"
              echo "android.api = 33" >> "$SPEC"
              echo "android.minapi = 24" >> "$SPEC"
              echo "android.sdk = 33" >> "$SPEC"
              echo "android.accept_sdk_license_agreement = True" >> "$SPEC"
              echo "android.add_jars = reader.jar" >> "$SPEC"
              cat "$SPEC"
              echo "---"
            fi
          done
          if [ -f "buildozer_full_UHF.spec" ] && [ ! -f "buildozer.spec" ]; then
            cp buildozer_full_UHF.spec buildozer.spec
          fi
          if [ -f "buildozer_full_UHF.spec" ]; then
            cp buildozer.spec buildozer_full_UHF.spec
          fi
          echo "=== Final buildozer.spec ==="
          cat buildozer.spec
      - name: Build APK
        run: |
          set -o pipefail
          buildozer android debug --verbose 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Buildozer exit code: $BUILD_EXIT"
          echo "=== Checking for APK ==="
          ls -lh bin/ || echo "bin/ not found"
          find . -name "*.apk" -type f | head -20
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "Buildozer failed with code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi
          if [ ! -f bin/*.apk ] && [ $(find bin -name "*.apk" 2>/dev/null | wc -l) -eq 0 ]; then
            echo "ERROR: No APK generated!"
            echo "Last 100 lines of build.log:"
            tail -100 build.log
            exit 1
          fi
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            .buildozer/logs/*
          if-no-files-found: warn
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-ict-apk-full-uhf
          path: bin/*.apk
          if-no-files-found: error
