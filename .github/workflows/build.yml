name: Build MATRIX APK FULL UHF
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev libltdl-dev autoconf automake libtool pkg-config zlib1g-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Create clean buildozer.spec - FINAL FIX
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = MATRIX ICT RFID
          package.name = matrixictrfid
          package.domain = com.matrixict.rfid
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,jar
          source.include_patterns = libs/*,reader.jar,03_Libs_UHF_C72/*
          version = 1.0
          requirements = python3==3.11.6,kivy==2.3.1,pyjnius,requests
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET,ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION,BLUETOOTH,BLUETOOTH_ADMIN,BLUETOOTH_CONNECT,BLUETOOTH_SCAN
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          android.add_jars = reader.jar
          p4a.branch = master
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          cat buildozer.spec
          if [ -f "03_Libs_UHF_C72/reader.jar" ]; then cp 03_Libs_UHF_C72/reader.jar ./reader.jar; echo "Copied reader.jar"; ls -lh reader.jar; fi
          if [ -d "03_Libs_UHF_C72/libs" ]; then cp -r 03_Libs_UHF_C72/libs ./; fi

      - name: Pre-clone p4a master and patch ALL bugs
        run: |
          echo "=== 1. Clean old p4a ==="
          rm -rf .buildozer/android/platform/python-for-android
          mkdir -p .buildozer/android/platform
          
          echo "=== 2. Clone master (exists) ==="
          git clone https://github.com/kivy/python-for-android.git .buildozer/android/platform/python-for-android --branch master --depth 1
          cd .buildozer/android/platform/python-for-android
          echo "Cloned: $(git log -1 --oneline)"
          
          echo "=== 3. Patch pip 26 bug (BuildDependencyInstallError) ==="
          sed -i 's/pip install -U pip/echo "skip pip upgrade - patched"/g' pythonforandroid/build.py
          
          echo "=== 4. Pre-create Android SDK licenses to fix Aidl error ==="
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_DIR/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK_DIR/licenses/android-sdk-license
          echo "24333f8a63b6825ea1c5514fbf989ee4384f793" >> $SDK_DIR/licenses/android-sdk-license
          echo "y" > $SDK_DIR/licenses/android-sdk-preview-license || true
          echo "Licenses created"
          cat $SDK_DIR/licenses/android-sdk-license
          
          cd $GITHUB_WORKSPACE

      - name: Build APK - with license acceptance
        run: |
          set -o pipefail
          # Accept all licenses before build
          SDK_MGR=$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          if [ -f "$SDK_MGR" ]; then
            echo "Accepting licenses via sdkmanager..."
            yes | $SDK_MGR --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses || true
          fi
          buildozer android debug --verbose 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Build exit: $EXIT_CODE"
          ls -lh bin/ || echo "No bin"
          find . -name "*.apk" -type f | head -20
          exit $EXIT_CODE

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            .buildozer/logs/*
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-ict-apk-full-uhf
          path: bin/*.apk
          if-no-files-found: warn
