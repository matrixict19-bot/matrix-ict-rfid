name: Build MATRIX APK FULL UHF
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev libltdl-dev autoconf automake libtool pkg-config zlib1g-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Create clean buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = MATRIX ICT RFID
          package.name = matrixictrfid
          package.domain = com.matrixict.rfid
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,jar
          source.include_patterns = libs/*,reader.jar,03_Libs_UHF_C72/*
          version = 1.0
          requirements = python3==3.11.6,kivy==2.3.1,pyjnius,requests
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET,ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION,BLUETOOTH,BLUETOOTH_ADMIN,BLUETOOTH_CONNECT,BLUETOOTH_SCAN
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          android.add_jars = reader.jar
          p4a.branch = master
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          cat buildozer.spec
          if [ -f "03_Libs_UHF_C72/reader.jar" ]; then cp 03_Libs_UHF_C72/reader.jar ./reader.jar; echo "reader.jar copied"; fi

      - name: Pre-clone p4a master - fix ALL old bugs
        run: |
          echo "Clean old SDK/NDK to force fresh download with correct structure (fixes sdkmanager path)"
          rm -rf $HOME/.buildozer/android/platform/android-sdk
          rm -rf $HOME/.buildozer/android/platform/android-ndk-*
          rm -rf .buildozer/android/platform/python-for-android
          mkdir -p .buildozer/android/platform
          
          echo "Clone p4a master (branch exists)"
          git clone https://github.com/kivy/python-for-android.git .buildozer/android/platform/python-for-android --branch master --depth 1
          echo "Cloned $(cd .buildozer/android/platform/python-for-android && git log -1 --oneline)"
          
          echo "Patch pip 26 bug"
          sed -i 's/pip install -U pip/echo "skip pip upgrade"/g' .buildozer/android/platform/python-for-android/pythonforandroid/build.py

      - name: Build APK - with sdkmanager compat fix
        run: |
          set -o pipefail
          # First run will download SDK (may fail on license), we fix sdkmanager path then retry
          echo "=== Attempt 1: Download SDK ==="
          buildozer android debug --verbose 2>&1 | tee build.log || true
          
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          NEW_MGR=$SDK_DIR/cmdline-tools/latest/bin/sdkmanager
          OLD_MGR=$SDK_DIR/tools/bin/sdkmanager
          
          echo "=== Fix sdkmanager path (new -> old compat) ==="
          if [ -f "$NEW_MGR" ]; then
            mkdir -p $(dirname $OLD_MGR)
            ln -sf $NEW_MGR $OLD_MGR
            echo "Linked $NEW_MGR -> $OLD_MGR"
          fi
          
          echo "=== Accept licenses ==="
          if [ -f "$NEW_MGR" ]; then
            yes | $NEW_MGR --sdk_root=$SDK_DIR --licenses || true
          fi
          if [ -f "$OLD_MGR" ]; then
            yes | $OLD_MGR --sdk_root=$SDK_DIR --licenses || true
          fi
          
          # Create licenses manually as fallback
          mkdir -p $SDK_DIR/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_DIR/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK_DIR/licenses/android-sdk-license
          echo "24333f8a63b6825ea1c5514fbf989ee4384f793" >> $SDK_DIR/licenses/android-sdk-license
          
          echo "=== Attempt 2: Real build ==="
          buildozer android debug --verbose 2>&1 | tee -a build.log
          echo "Exit code: ${PIPESTATUS[0]}"
          ls -lh bin/ || true
          find . -maxdepth 3 -name "*.apk" -type f

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            .buildozer/logs/*
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-ict-apk-full-uhf
          path: bin/*.apk
          if-no-files-found: warn
